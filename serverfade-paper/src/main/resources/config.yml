# Затемнение внутри сервера (телепорт на арену и т.п.); его вызывают другие плагины через API.
# Переходы между серверами затемняет ServerFade на BungeeCord, этот плагин их не трогает.
# Нужен ресурспак ServerFade (папка resourcepack).
# Все времена в тиках (20 = 1 секунда), от 0 до 200.

# Экран плавно темнеет столько тиков; действие (телепорт) выполняется, когда он уже чёрный.
fade-in-ticks: 10
# /fade test и затемнение без действия: сколько экран может держаться чёрным, пока его не проявят.
hold-ticks: 100
# После действия: сначала столько тиков чёрный экран (пока прогружаются чанки)...
reveal-hold-ticks: 10
# ...потом он плавно светлеет столько тиков.
reveal-ticks: 20

# /fade test - затемнение и проявление, /fade reload - перечитать этот файл (право serverfade.admin).
