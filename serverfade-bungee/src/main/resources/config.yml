# Затемнение при переходе между серверами. Нужен ресурспак ServerFade (папка resourcepack).
# Все времена в тиках (20 = 1 секунда), от 0 до 200.

# Экран плавно темнеет столько тиков; игрок уходит на другой сервер, когда он уже чёрный.
fade-in-ticks: 10
# Сколько экран держится чёрным, пока идёт переход (с запасом: на новом сервере его сменит проявление).
hold-ticks: 100
# На новом сервере: сначала столько тиков чёрный экран (пока прогружаются чанки)...
reveal-hold-ticks: 10
# ...потом он плавно светлеет столько тиков.
reveal-ticks: 20

# Игра проявляется из чёрного и при первом входе на прокси.
reveal-on-first-join: true
# Переходы с этих серверов и на них не затемняются (имена из config.yml BungeeCord).
ignored-servers: []

# /serverfade test - затемнение без перехода, /serverfade reload - перечитать этот файл (право serverfade.admin).
